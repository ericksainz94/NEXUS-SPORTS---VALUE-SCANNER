name: Nexus Sports Value Scanner

# Los horarios ya NO los maneja el cron nativo de GitHub (resulto ser poco
# confiable para este repo -- se quedaba "pegado" a horarios viejos en vez
# de disparar en los horarios reales configurados). En su lugar, un
# servicio externo gratuito (cron-job.org) llama a este workflow a la hora
# exacta via la API de GitHub (workflow_dispatch), pasando el deporte
# correspondiente. Ver cron-job.org para los 5 horarios configurados:
# Futbol, Tenis, Hockey, NBA, y el analisis de Parlay.
#
# Si un deporte no tiene partidos o no tiene valor ese dia, simplemente no
# se envia nada de ese deporte ese dia -- eso es lo esperado, no un error.

on:
  workflow_dispatch:
    inputs:
      deporte:
        description: "Que deporte/analisis correr (lo manda cron-job.org, o pruébalo manual aquí)"
        required: true
        default: "FUTBOL"
        type: choice
        options:
          - FUTBOL
          - TENIS
          - HOCKEY
          - NBA
          - NFL
          - PARLAY
          - SPORTS

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pytz

      - name: Ejecutar el scanner
        env:
          TOKEN_TG: ${{ secrets.TOKEN_TG }}
          API_KEY_ODDS: ${{ secrets.API_KEY_ODDS }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nexus_sports_value.py once ${{ github.event.inputs.deporte }}

      - name: Guardar historial actualizado (CSV + JSON para la web)
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add picks_log.csv parlays_log.csv docs/picks.json docs/parlays.json || true
          git diff --staged --quiet || git commit -m "Actualiza historial de picks/parlays [automatico]"
          git push
