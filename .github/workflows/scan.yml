name: Nexus Sports Value Scanner

# Corre el bot en los horarios de cada deporte SIN necesidad de servidor
# propio ni que tu compu este prendida. Los horarios estan en UTC porque
# GitHub Actions no entiende zonas horarias directamente.
#
# America/Mazatlan = UTC-7 todo el año (Sinaloa ya no cambia de horario).
# Si tu horario cambia, ajusta aqui restando/sumando a la hora UTC.
#
#   07:30 hora Mazatlan -> 14:30 UTC (Futbol)
#   08:00 hora Mazatlan -> 15:00 UTC (Tenis)
#   15:30 hora Mazatlan -> 22:30 UTC (Hockey)
#   16:00 hora Mazatlan -> 23:00 UTC (NBA)
#   16:10 hora Mazatlan -> 23:10 UTC (Analisis de parlay, solo Futbol+NBA)
#
# NOTA: GitHub Actions no garantiza el minuto EXACTO en horas pico (puede
# atrasarse unos minutos). Para algo tan sensible a horarios de inicio de
# partido, calcula con margen.
#
# Si un deporte no tiene partidos o no tiene valor ese dia, simplemente no
# se envia nada de ese deporte ese dia -- eso es lo esperado, no un error.

on:
  schedule:
    - cron: "30 14 * * *"   # Futbol
    - cron: "0 15 * * *"    # Tenis
    - cron: "30 22 * * *"   # Hockey
    - cron: "0 23 * * *"    # NBA
    - cron: "10 23 * * *"   # Analisis de parlay (Futbol + NBA de hoy)
  workflow_dispatch:         # te deja correrlo manualmente desde GitHub tambien
    inputs:
      deporte:
        description: "Que forzar ahora mismo (prueba manual)"
        required: true
        default: "FUTBOL"
        type: choice
        options:
          - FUTBOL
          - TENIS
          - HOCKEY
          - NBA
          - PARLAY

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pytz

      - name: Determinar que corresponde a este horario
        id: deporte
        run: |
          case "${{ github.event.schedule }}" in
            "30 14 * * *") echo "nombre=FUTBOL" >> "$GITHUB_OUTPUT" ;;
            "0 15 * * *")  echo "nombre=TENIS" >> "$GITHUB_OUTPUT" ;;
            "30 22 * * *") echo "nombre=HOCKEY" >> "$GITHUB_OUTPUT" ;;
            "0 23 * * *")  echo "nombre=NBA" >> "$GITHUB_OUTPUT" ;;
            "10 23 * * *") echo "nombre=PARLAY" >> "$GITHUB_OUTPUT" ;;
            *) echo "nombre=${{ github.event.inputs.deporte }}" >> "$GITHUB_OUTPUT" ;;  # prueba manual
          esac

      - name: Ejecutar el scanner
        env:
          TOKEN_TG: ${{ secrets.TOKEN_TG }}
          API_KEY_ODDS: ${{ secrets.API_KEY_ODDS }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nexus_sports_value.py once ${{ steps.deporte.outputs.nombre }}

      - name: Guardar historial actualizado (CSV + JSON para la web)
        run: |
          git config user.name "nexus-bot"
          git config user.email "nexus-bot@users.noreply.github.com"
          git add picks_log.csv parlays_log.csv docs/picks.json docs/parlays.json || true
          git diff --staged --quiet || git commit -m "Actualiza historial de picks/parlays [automatico]"
          git push
